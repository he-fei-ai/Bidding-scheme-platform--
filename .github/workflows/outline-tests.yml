name: CI - 目录生成模块质量门禁

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'backend/tests/test_outline_*.py'
      - '.github/workflows/outline-tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/app/**'
      - 'backend/tests/test_outline_*.py'
      - '.github/workflows/outline-tests.yml'

jobs:
  # ── Job 1: Python 3.12+ event loop 兼容性（核心修复回归）────────
  asyncio-compat:
    name: asyncio event loop compat (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run asyncio event loop regression tests
        run: |
          python -m pytest tests/test_outline_asyncio.py \
            -v --tb=short \
            -k "asyncio or run_until or datetime or celery or safe_asyncio" \
            -W ignore::pytest.PytestUnraisableExceptionWarning

      - name: Run outline integration tests (full flow)
        run: |
          python -m pytest tests/test_outline_integration.py \
            -v --tb=short \
            --disable-warnings

  # ── Job 2: 完整测试套件（含 lint）────────
  full-suite:
    name: Full test suite + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio ruff

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

      - name: Run all outline tests
        run: |
          python -m pytest tests/test_outline_asyncio.py \
                           tests/test_outline_integration.py \
            -v --tb=long \
            -W ignore::pytest.PytestUnraisableExceptionWarning

  # ── Job 3: Python 3.12 专项 — Celery 嵌套 asyncio.run 极端场景（防回归）────────
  celery-asyncio-regression:
    name: Celery asyncio.run regression (py3.12 only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run Celery event loop regression tests
        # 专门针对 Python 3.12 的 Celery 嵌套 asyncio.run 场景
        run: |
          python -m pytest tests/test_outline_asyncio.py \
            -v --tb=short \
            -k "celery or safe_asyncio" \
            -W ignore::pytest.PytestUnraisableExceptionWarning

      - name: Run full suite on Python 3.12 (regression guard)
        run: |
          python -m pytest tests/test_outline_asyncio.py \
                           tests/test_outline_integration.py \
            -v --tb=short \
            -W ignore::pytest.PytestUnraisableExceptionWarning
